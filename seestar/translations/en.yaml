# Option labels + help text shown in the app's Configuration tab. Keys mirror the
# schema in config.yaml one-for-one.
configuration:
  scopes:
    name: Telescopes
    description: >-
      Bundled mode only. One entry per Seestar — each becomes its own Home
      Assistant device and seeds the bundled driver's config. Each entry needs a
      name (the HA device name — pick a stable one, since renaming it later
      creates a new device and new entity IDs) and a host (the telescope's IP
      address or hostname on your LAN). Leave empty if you point alpaca_host at an
      existing seestar_alp instead.
  alpaca_host:
    name: External Alpaca driver
    description: >-
      Leave blank to use the bundled driver. To reuse your own seestar_alp
      instead, set host:port here AND leave the Telescopes list empty — the
      external instance already knows your scopes. Setting both is rejected at
      startup.
  interop_pem_path:
    name: Interoperability PEM path
    description: >-
      Bundled mode only. Optional path to an unencrypted RSA private key used by
      firmware 7.18+ authentication. Store the key privately under
      /share/seestar/ and enter its full in-container path, for example
      /share/seestar/seestar_interop.pem. The key remains read-only and is never
      stored in add-on options or logs. Leave blank to disable authentication.
  alpaca_webui_port:
    name: External web UI port
    description: >-
      External mode only: the port your seestar_alp serves its /config page on, used
      to look up each scope's address for the preview. Default 5432.
  mqtt_host:
    name: MQTT host
    description: >-
      Leave blank to use the Mosquitto add-on automatically (via the Supervisor MQTT
      service). Set a hostname or IP to publish to a different broker instead.
  mqtt_port:
    name: MQTT port
    description: >-
      Broker port. Only used when overriding mqtt_host; ignored while mqtt_host is
      blank (the Supervisor MQTT service supplies the port). Set e.g. 8883 for a
      TLS broker.
  mqtt_username:
    name: MQTT username
    description: Username for the broker. Leave blank when using the Mosquitto add-on.
  mqtt_password:
    name: MQTT password
    description: Password for the broker. Leave blank when using the Mosquitto add-on.
  mqtt_ssl:
    name: MQTT TLS
    description: >-
      Connect to the broker over TLS. Only relevant when overriding mqtt_host; the
      Mosquitto add-on connection is configured by the Supervisor.
  discovery_prefix:
    name: Discovery prefix
    description: >-
      MQTT discovery topic prefix. Must match Home Assistant's MQTT integration
      setting (default "homeassistant"). Change only if you customised it there.
  event_poll_sec:
    name: Event poll interval (s)
    description: >-
      How often to poll the fast Alpaca event stream for imaging telemetry. Lower is
      more responsive; higher is gentler on the driver. Default 10.
  state_poll_sec:
    name: Device state poll interval (s)
    description: >-
      How often to poll the slower device-state call (mount mode, focuser, battery,
      firmware). Default 30.
  preview_max_px:
    name: Preview max size (px)
    description: >-
      Longest-edge limit for the stacked preview image before publishing; larger
      previews are downscaled to this. Default 1280.
  log_level:
    name: Log level
    description: >-
      Verbosity of the bridge and bundled driver logs. Use debug or trace when
      diagnosing a connection problem. Raw bundled-driver payloads remain
      redacted unless Sensitive payload logging is enabled. Default info.
  log_sensitive_payloads:
    name: Sensitive payload logging
    description: >-
      Bundled mode only. Allow raw telescope response payloads in the app log.
      These payloads can contain Wi-Fi credentials, identifiers, and precise
      location data. Keep this disabled except for a short, controlled diagnostic
      session, then delete the resulting log. Default disabled.
